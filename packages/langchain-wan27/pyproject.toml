[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langchain-wan27"
version = "0.1.0"
description = "LangChain tools for Wan27 image and video model discovery, credit estimates and authorized generation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Wan27"}]
dependencies = ["wan27>=0.1.0,<0.2", "langchain-core>=0.3,<2"]
keywords = ["langchain", "wan27", "ai", "image-generation", "video-generation"]

[project.urls]
Homepage = "https://wan2-7.io/"
Documentation = "https://wan2-7.io/mcp/guide/"
Repository = "https://github.com/NotUsingGithub/wan27-python"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_wan27"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]
