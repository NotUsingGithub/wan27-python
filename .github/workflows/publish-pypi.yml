name: Validate and optionally publish Python packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish both validated packages to PyPI (requires configured Trusted Publishers)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: wan27-python-pypi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install build and test dependencies
        run: python -m pip install build twine . ./packages/langchain-wan27
      - name: Test the Python client (mock HTTP only)
        run: python -m unittest discover -s tests -v
      - name: Test LangChain tools (mock client only)
        run: python -m unittest discover -s packages/langchain-wan27/tests -v
      - name: Build both wheels and source distributions
        run: |
          python -m build --outdir dist .
          python -m build --outdir dist packages/langchain-wan27
          python -m twine check dist/*
      - name: Verify the built wheels install together
        run: |
          python -m venv /tmp/wan27-wheel-check
          /tmp/wan27-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/wan27-wheel-check/bin/python -c "from wan27 import Wan27; import langchain_wan27; print('Both built packages imported')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
